name: 🌙 EOD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Daily Direct-Growth Update
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        submodules: recursive

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        if [ -n "$TJQL_TOKEN" ]; then
          pip install "git+https://${TJQL_TOKEN}@github.com/tejasmr/tjql.git"
        else
          pip install "git+https://github.com/tejasmr/tjql.git"
        fi
      env:
        TJQL_TOKEN: ${{ secrets.TJQL_TOKEN }}

    - name: Download Latest DuckDB Release
      run: |
        # Try downloading from 'latest' release, falling back to the repo's latest release
        gh release download latest --pattern "funds.duckdb.zst" || gh release download --pattern "funds.duckdb.zst"
        zstd -d -f funds.duckdb.zst
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Run Incremental Update
      run: |
        python scripts/daily_update.py --database funds.duckdb

    - name: Compress Database
      run: |
        zstd -5 -T0 -f funds.duckdb -o funds.duckdb.zst
        ls -lh funds.duckdb.zst

    - name: Publish Updated Release
      run: |
        # Update the 'latest' release asset, or create it if it doesn't exist yet
        gh release upload latest funds.duckdb.zst --clobber || \
        gh release create latest funds.duckdb.zst \
          --title "Latest Mutual Fund Data (Rolling)" \
          --notes "Daily updated Direct-Growth mutual fund dataset in DuckDB format."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Discord Notifications
      run: |
        # Deliver pipeline execution summary to #eod
        if [ -n "$DISCORD_WEBHOOK_URL_EOD" ]; then
          python scripts/notify_discord.py --mode summary --database funds.duckdb --channel eod
        fi
        # Deliver triggers to split analytics channels (#index-analytics, #equity-fund-analytics, #other-fund-analytics)
        python scripts/notify_discord.py --mode triggers --database funds.duckdb --channel all-analytics
      env:
        DISCORD_WEBHOOK_URL_EOD: ${{ secrets.DISCORD_WEBHOOK_URL_EOD }}
        DISCORD_WEBHOOK_URL_INDEX_ANALYTICS: ${{ secrets.DISCORD_WEBHOOK_URL_INDEX_ANALYTICS }}
        DISCORD_WEBHOOK_URL_EQUITY_FUND_ANALYTICS: ${{ secrets.DISCORD_WEBHOOK_URL_EQUITY_FUND_ANALYTICS }}
        DISCORD_WEBHOOK_URL_OTHER_FUND_ANALYTICS: ${{ secrets.DISCORD_WEBHOOK_URL_OTHER_FUND_ANALYTICS }}
