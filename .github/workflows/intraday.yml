name: 🔄 Intraday

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: 'Force send notification even if outside market hours or cached'
        type: boolean
        default: false
      dry_run:
        description: 'Inspect live opportunities without sending webhook'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  intraday:
    name: Intraday Index Opportunity Screener
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -n "$TJQL_TOKEN" ]; then
            pip install "git+https://${TJQL_TOKEN}@github.com/tejasmr/tjql.git"
          else
            pip install "git+https://github.com/tejasmr/tjql.git"
          fi
        env:
          TJQL_TOKEN: ${{ secrets.TJQL_TOKEN }}

      - name: Get Current Date for Cache Key
        id: cache-key
        run: |
          echo "date=$(TZ='Asia/Kolkata' date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Cache Intraday Alert State
        uses: actions/cache@v6
        with:
          path: .intraday_cache
          key: intraday-state-${{ steps.cache-key.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            intraday-state-${{ steps.cache-key.outputs.date }}-

      - name: Run Intraday Opportunity Check
        run: |
          ARGS=""
          if [ "${{ inputs.force_send }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/notify_discord.py --mode intraday --channel intraday $ARGS
        env:
          DISCORD_WEBHOOK_URL_INTRADAY: ${{ secrets.DISCORD_WEBHOOK_URL_INTRADAY }}

