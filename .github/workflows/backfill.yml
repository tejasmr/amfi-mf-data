name: Backfill DuckDB Dataset

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        default: '2013-01-01'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        default: '2026-10-23'
      release_tag:
        description: 'Release tag to publish artifact to'
        required: true
        default: 'v2026.10.23'

permissions:
  contents: write

jobs:
  backfill:
    name: Backfill Direct-Growth Dataset
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1
        submodules: recursive

    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install duckdb zstandard
        if [ -d "tjql" ]; then
          pip install -e ./tjql
        else
          pip install git+https://github.com/tejasmr/tjql.git
        fi

    - name: Run Backfill
      run: |
        python scripts/backfill_duckdb.py \
          --start-date "${{ inputs.start_date }}" \
          --end-date "${{ inputs.end_date }}" \
          --database funds.duckdb \
          --progress-every 250

    - name: Compress Database
      run: |
        zstd -5 -T0 funds.duckdb
        ls -lh funds.duckdb*

    - name: Publish Backfill Release
      run: |
        gh release create "${{ inputs.release_tag }}" \
          --title "AMFI Direct-Growth Mutual Fund Data (${{ inputs.start_date }} to ${{ inputs.end_date }})" \
          --notes "Complete Direct-Growth mutual fund dataset in DuckDB format up to ${{ inputs.end_date }}. Cleaned and normalized with tjql." \
          funds.duckdb.zst
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
